  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

=\"stagger\" style=\"animation-delay:0ms;display:flex;flex-direction:column;gap:24px;align-self:stretch\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n            <span style=\"font:600 12px var(--g);line-height:100%;color:rgb(109,106,120);text-transform:uppercase\">WHERE THINGS STAND<\u002Fspan>\n            <span style=\"font:700 24px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">Peace talks have stalled again.<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font:400 16px var(--g);line-height:22px;color:rgb(60,57,71)\">The June framework meant to move the U.S. and Iran toward a permanent settlement has expired without resolving the conflict. Neither side is currently committed to restarting direct talks, while sanctions, military pressure, and the dispute over the Strait of Hormuz continue.<\u002Fspan>\n          <span style=\"font:400 12px var(--g);line-height:100%;color:rgb(109,106,120)\">Grounded in 9 evidence items · 4 primary sources<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"align-self:stretch;height:0.5px;background:rgba(23,21,28,0.08);flex-shrink:0\"><\u002Fdiv>\n        <div class=\"stagger\" style=\"animation-delay:110ms;display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n          <span style=\"font:600 12px var(--g);line-height:100%;color:rgb(109,106,120);text-transform:uppercase\">WHY IT MATTERS<\u002Fspan>\n          <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">The question is no longer whether the June agreement can produce a settlement. It is whether either side will create a new diplomatic path before the conflict hardens into a prolonged standoff.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"align-self:stretch;height:0.5px;background:rgba(23,21,28,0.08);flex-shrink:0\"><\u002Fdiv>\n        <div class=\"stagger\" style=\"animation-delay:220ms;display:flex;flex-direction:column;gap:24px;align-self:stretch\">\n          <span style=\"font:600 12px var(--g);line-height:100%;color:rgb(109,106,120);text-transform:uppercase\">3 Developments changed the loop<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:24px;align-self:stretch\">\n            <div style=\"display:flex;gap:16px;align-items:flex-start;align-self:stretch\">\n              <span style=\"width:48px;flex-shrink:0;font:700 12px var(--g);line-height:24px;color:rgb(141,138,150)\">Aug 17<\u002Fspan>\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n                  <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">The June framework expired<\u002Fspan>\n                  <span style=\"font:400 14px var(--g);line-height:18px;color:rgb(141,138,150)\">The 60-day window intended to move both sides toward a wider peace agreement ended without the core disputes being resolved.<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:16px;align-items:center\">\n                  <div style=\"border-radius:999px;background:rgba(21,122,83,0.1);box-shadow:inset 0 0 0 0.5px rgba(21,122,83,0.18),0 0 0 0.5px rgba(21,122,83,0.18);padding:6px 10px\"><span style=\"font:700 12px var(--g);line-height:100%;color:rgb(19,102,71);text-transform:uppercase\">Confirmed<\u002Fspan><\u002Fdiv>\n                  <span style=\"font:500 14px var(--g);line-height:100%;color:rgb(151,71,255)\">Evidence (3)<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:16px;align-items:flex-start;align-self:stretch\">\n              <span style=\"width:48px;flex-shrink:0;font:700 12px var(--g);line-height:24px;color:rgb(141,138,150)\">Aug 19<\u002Fspan>\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n                  <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">Direct talks are off the calendar<\u002Fspan>\n                  <div style=\"position:relative\">\n                    <div id=\"prev-understanding\" style=\"display:none\"><span style=\"font:400 14px var(--g);line-height:18px;color:rgb(180,120,60)\">Earlier read: a limited window for talks was still thought possible before month’s end.<\u002Fspan><\u002Fdiv>\n                    <div id=\"new-understanding\"><span style=\"font:400 14px var(--g);line-height:18px;color:rgb(141,138,150)\">The U.S. says no negotiations with Iran are currently planned. Iran has also stopped short of committing to a return to talks.<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span id=\"prev-toggle\" sc-camel-on-click=\"{{ togglePrevUnderstanding }}\" style=\"cursor:pointer;font:600 12px var(--g);line-height:100%;color:rgb(151,71,255)\">See what changed ↓<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:16px;align-items:center\">\n                  <div style=\"border-radius:999px;background:rgba(21,122,83,0.1);box-shadow:inset 0 0 0 0.5px rgba(21,122,83,0.18),0 0 0 0.5px rgba(21,122,83,0.18);padding:6px 10px\"><span style=\"font:700 12px var(--g);line-height:100%;color:rgb(19,102,71);text-transform:uppercase\">Confirmed<\u002Fspan><\u002Fdiv>\n                  <span style=\"font:500 14px var(--g);line-height:100%;color:rgb(151,71,255)\">Evidence (3)<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:16px;align-items:flex-start;align-self:stretch\">\n              <span style=\"width:48px;flex-shrink:0;font:700 12px var(--g);line-height:24px;color:rgb(141,138,150)\">Aug 21<\u002Fspan>\n              <div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n                  <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">Washington is increasing economic pressure<\u002Fspan>\n                  <span style=\"font:400 14px var(--g);line-height:18px;color:rgb(141,138,150)\">The U.S. is preparing a new sanctions push aimed at increasing pressure on Tehran while reducing the need for further large-scale military action.<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:16px;align-items:center\">\n                  <div style=\"border-radius:999px;background:rgba(21,122,83,0.1);box-shadow:inset 0 0 0 0.5px rgba(21,122,83,0.18),0 0 0 0.5px rgba(21,122,83,0.18);padding:6px 10px\"><span style=\"font:700 12px var(--g);line-height:100%;color:rgb(19,102,71);text-transform:uppercase\">Confirmed<\u002Fspan><\u002Fdiv>\n                  <span style=\"font:500 14px var(--g);line-height:100%;color:rgb(151,71,255)\">Evidence (3)<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"align-self:stretch;height:0.5px;background:rgba(23,21,28,0.08);flex-shrink:0\"><\u002Fdiv>\n        <div class=\"stagger\" style=\"animation-delay:330ms;display:flex;flex-direction:column;gap:24px;align-self:stretch\">\n          <span style=\"font:600 12px var(--g);line-height:100%;color:rgb(109,106,120);text-transform:uppercase\">What keeps this open<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:24px;align-self:stretch\">\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-self:stretch\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n                <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">Will either side return to direct negotiations?<\u002Fspan>\n                <span style=\"font:400 14px var(--g);line-height:18px;color:rgb(141,138,150)\">No new talks are scheduled, but regional mediators continue trying to reopen a diplomatic channel.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:inline-flex;width:max-content;border-radius:999px;background:rgb(255,255,255);box-shadow:inset 0 0 0 0.5px rgba(23,21,28,0.08),0 0 0 0.5px rgba(23,21,28,0.08);padding:6px 10px\"><span style=\"font:700 12px var(--g);line-height:100%;color:rgb(109,106,120);text-transform:uppercase\">Unresolved<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-self:stretch\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n                <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">Can they agree on the Strait of Hormuz?<\u002Fspan>\n                <span style=\"font:400 14px var(--g);line-height:18px;color:rgb(141,138,150)\">Iran and the U.S. remain divided over access, control, and the conditions required for normal shipping to resume.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:inline-flex;width:max-content;border-radius:999px;background:rgb(255,255,255);box-shadow:inset 0 0 0 0.5px rgba(23,21,28,0.08),0 0 0 0.5px rgba(23,21,28,0.08);padding:6px 10px\"><span style=\"font:700 12px var(--g);line-height:100%;color:rgb(109,106,120);text-transform:uppercase\">Unresolved<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:12px;align-self:stretch\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n                <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">Can sanctions and nuclear restrictions be traded for de-escalation?<\u002Fspan>\n                <span style=\"font:400 14px var(--g);line-height:18px;color:rgb(141,138,150)\">Sanctions relief, Iran’s nuclear program, and broader security guarantees remain tied together in any durable settlement.<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:inline-flex;width:max-content;border-radius:999px;background:rgb(255,255,255);box-shadow:inset 0 0 0 0.5px rgba(23,21,28,0.08),0 0 0 0.5px rgba(23,21,28,0.08);padding:6px 10px\"><span style=\"font:700 12px var(--g);line-height:100%;color:rgb(109,106,120);text-transform:uppercase\">Unresolved<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"align-self:stretch;height:0.5px;background:rgba(23,21,28,0.08);flex-shrink:0\"><\u002Fdiv>\n        <div class=\"stagger\" style=\"animation-delay:440ms;display:flex;flex-direction:column;gap:24px;align-self:stretch\">\n          <span style=\"font:600 12px var(--g);line-height:100%;color:rgb(109,106,120);text-transform:uppercase\">HOW WE GOT HERE<\u002Fspan>\n          <div style=\"display:flex;gap:16px;align-items:stretch;align-self:stretch\">\n            <div style=\"width:10px;flex-shrink:0;display:flex;flex-direction:column;align-items:center\">\n              <div style=\"height:16px;display:flex;align-items:center;flex-shrink:0\"><div style=\"width:10px;height:10px;border-radius:99px;background:rgb(151,71,255)\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"width:1px;height:128px;background:rgba(151,71,255,0.14);flex-shrink:0\"><\u002Fdiv>\n              <div style=\"height:16px;display:flex;align-items:center;flex-shrink:0\"><div style=\"width:10px;height:10px;border-radius:99px;background:rgb(151,71,255)\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"width:1px;height:104px;background:rgba(151,71,255,0.14);flex-shrink:0\"><\u002Fdiv>\n              <div style=\"height:16px;display:flex;align-items:center;flex-shrink:0\"><div style=\"width:10px;height:10px;border-radius:99px;background:rgb(151,71,255)\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"width:1px;height:104px;background:rgba(23,21,28,0.08);flex-shrink:0\"><\u002Fdiv>\n              <div style=\"height:16px;display:flex;align-items:center;flex-shrink:0\"><div style=\"width:10px;height:10px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(23,21,28,0.2)\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"width:1px;height:128px;background:rgba(23,21,28,0.08);flex-shrink:0\"><\u002Fdiv>\n              <div style=\"height:16px;display:flex;align-items:center;flex-shrink:0\"><div style=\"width:10px;height:10px;border-radius:99px;box-shadow:inset 0 0 0 1px rgba(23,21,28,0.2)\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"width:1px;flex:1;background:rgba(23,21,28,0.08)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;display:flex;flex-direction:column;gap:24px\">\n              <div style=\"display:flex;flex-direction:column;gap:12px;align-self:stretch\">\n                <div style=\"display:flex;gap:12px;align-items:center\"><span style=\"font:700 12px var(--g);line-height:100%;color:rgb(141,138,150)\">Aug 21<\u002Fspan><span style=\"font:700 11px var(--g);line-height:100%;color:rgb(151,71,255)\">MEANINGFUL CHANGE<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n                  <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">U.S. prepares new sanctions<\u002Fspan>\n                  <span style=\"font:400 14px var(--g);line-height:18px;color:rgb(141,138,150)\">Washington signals that economic pressure will become a larger part of its strategy toward Iran.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px;align-self:stretch\">\n                <div style=\"display:flex;gap:12px;align-items:center\"><span style=\"font:700 12px var(--g);line-height:100%;color:rgb(141,138,150)\">Aug 19<\u002Fspan><span style=\"font:700 11px var(--g);line-height:100%;color:rgb(151,71,255)\">MEANINGFUL CHANGE<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n                  <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">No direct talks planned<\u002Fspan>\n                  <span style=\"font:400 14px var(--g);line-height:18px;color:rgb(141,138,150)\">The diplomatic channel between Washington and Tehran remains effectively stalled.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px;align-self:stretch\">\n                <div style=\"display:flex;gap:12px;align-items:center\"><span style=\"font:700 12px var(--g);line-height:100%;color:rgb(141,138,150)\">Aug 17<\u002Fspan><span style=\"font:700 11px var(--g);line-height:100%;color:rgb(151,71,255)\">MEANINGFUL CHANGE<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n                  <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">The 60-day peace framework expires<\u002Fspan>\n                  <span style=\"font:400 14px var(--g);line-height:18px;color:rgb(141,138,150)\">The deadline passes without a permanent agreement or resolution of the central disputes.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px;align-self:stretch\">\n                <div style=\"display:flex;gap:12px;align-items:center\"><span style=\"font:700 12px var(--g);line-height:100%;color:rgb(141,138,150)\">Aug 03<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n                  <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">Iran says there are no current talks with the U.S.<\u002Fspan>\n                  <span style=\"font:400 14px var(--g);line-height:18px;color:rgb(141,138,150)\">Tehran continues discussions with Oman over temporary passage through the Strait of Hormuz.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:12px;align-self:stretch\">\n                <div style=\"display:flex;gap:12px;align-items:center\"><span style=\"font:700 12px var(--g);line-height:100%;color:rgb(141,138,150)\">Jun 17<\u002Fspan><span style=\"font:700 11px var(--g);line-height:100%;color:rgb(151,71,255)\">Loop Opened<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-self:stretch\">\n                  <span style=\"font:600 20px var(--r);line-height:24px;letter-spacing:-0.5px;color:rgb(23,21,28)\">U.S. and Iran sign a framework for negotiations<\u002Fspan>\n                  <span style=\"font:400 14px var(--g);line-height:18px;color:rgb(141,138,150)\">The agreement creates a 60-day process intended to address the conflict, freedom of navigation, sanctions and Iran’s nuclear and missile programs.<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font:700 14px var(--g);line-height:100%;color:rgb(151,71,255)\">View full history →<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"align-self:stretch;height:0.5px;background:rgba(23,21,28,0.08);flex-shrink:0\"><\u002Fdiv>\n        <div class=\"stagger\" style=\"animation-delay:550ms;display:flex;flex-direction:column;gap:24px;align-self:stretch\">\n          <span style=\"font:600 12px var(--g);line-height:100%;color:rgb(109,106,120);text-transform:uppercase\">Claims &amp; Evidence<\u002Fspan>\n     const splash = this.el('scr-splash');\n    const splashLogo = this.el('splash-logo-mark');\n    const splashWord = this.el('splash-wordmark');\n    const todayLogo = this.el('today-logo-mark');\n    const nav = this.el('global-nav');\n    const frame = this.el('app-frame');\n    const fr = frame.getBoundingClientRect();\n    const a = splashLogo.getBoundingClientRect();\n    const b = todayLogo.getBoundingClientRect();\n    const fly = document.createElement('div');\n    fly.style.cssText = \"position:absolute;z-index:220;pointer-events:none;background:linear-gradient(59.84deg,rgb(41,163,254) 0%,rgb(234,137,207) 45.94%,rgb(133,103,237) 91.88%,rgb(77,84,253) 139.21%);\";\n    this.applyLogoMask(fly, '100x47');\n    fly.style.left = (a.left - fr.left) + 'px';\n    fly.style.top = (a.top - fr.top) + 'px';\n    fly.style.width = a.width + 'px';\n    fly.style.height = a.height + 'px';\n    frame.appendChild(fly);\n    splashLogo.style.opacity = '0';\n    const blobs = splash.querySelector('.splash-blobs');\n    blobs.style.transition = 'opacity 400ms ease';\n    blobs.style.opacity = '0';\n    todayLogo.style.opacity = '0';\n    setTimeout(() => {\n      fly.style.transition = 'left 640ms cubic-bezier(0.32,0.9,0.3,1), top 640ms cubic-bezier(0.32,0.9,0.3,1), width 640ms cubic-bezier(0.32,0.9,0.3,1), height 640ms cubic-bezier(0.32,0.9,0.3,1)';\n      fly.style.left = (b.left - fr.left) + 'px';\n      fly.style.top = (b.top - fr.top) + 'px';\n      fly.style.width = b.width + 'px';\n      fly.style.height = b.height + 'px';\n      splash.style.transition = 'opacity 500ms ease 120ms';\n      splash.style.opacity = '0';\n      nav.style.transition = 'opacity 420ms ease 200ms';\n      nav.style.opacity = '1';\n      nav.style.pointerEvents = 'auto';\n    }, 30);\n    setTimeout(() => {\n      fly.remove();\n      splash.style.display = 'none';\n      todayLogo.style.opacity = '1';\n      this.runBannerSweep();\n    }, 720);\n  }\n\n  runBannerSweep() {\n    const layers =
